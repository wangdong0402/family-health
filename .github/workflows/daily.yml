name: 每日健康资讯自动更新

on:
  schedule:
    - cron: '15 23 * * *'  # 北京时间 07:15
    - cron: '30 4 * * *'   # 北京时间 12:30
    - cron: '45 12 * * *'  # 北京时间 20:45
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 下载仓库文件
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取健康新闻
        run: python fetch.py

      - name: 构建病情知识索引
        run: python build_index.py

      - name: 构建健康讲座视频索引
        run: python build_videos.py

      - name: 生成网页
        run: python generate.py

      - name: 确认 dist 目录存在
        run: |
          if [ ! -d "dist" ]; then
            echo "::error::dist 目录不存在，generate.py 可能执行失败"
            mkdir -p dist
            echo "<html><body>构建失败，请查看 Actions 日志</body></html>" > dist/index.html
          fi
          test -f dist/index.html || { echo "::error::dist/index.html 不存在"; exit 1; }
          du -sh dist

      - name: 保存数据到仓库
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # search_index.json 有 3.9MB 且每次全量重写，不提交到 main，避免仓库体积爆炸
          git add data/ ':(exclude)data/search_index.json'
          git diff --staged --quiet || git commit -m "自动更新 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || {
            git rebase --abort || true
            git reset --soft "origin/${GITHUB_REF_NAME}"
            git add data/ ':(exclude)data/search_index.json'
            git commit -m "自动更新 $(date -u +'%Y-%m-%d %H:%M UTC')"
          }
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: 发布到 gh-pages 分支
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
